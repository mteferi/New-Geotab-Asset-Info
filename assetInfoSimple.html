<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asset Information Display</title>
   
</head>
<body>
    <div id="asset-info-panel">
        <div class="status-message">
            <span class="icon-placeholder">📍</span>
            Select a vehicle on the map to view details.
        </div>
    </div>

    <script>
        // Global variables
        let api;
        let state;

        /**
         * Initialize the add-in
         */
        function initialize(freshApi, freshState, initializeCallback) {
            api = freshApi;
            state = freshState;
            
            
            
            initializeCallback();
        }

        function focus(freshApi, freshState) {
            api = freshApi;
            state = freshState;
        }

        function blur(freshApi, freshState) { }
    </script>
</body>
</html>
